[general]
live_config_reload = true

[window]
decorations = "Buttonless"
startup_mode = "Maximized"
dynamic_title = true
opacity = 0.8
blur = true

[font]
size = 13.0
normal = { family = "EnvyCodeR Nerd Font", style = "Regular" }
bold = { family = "EnvyCodeR Nerd Font", style = "Bold" }
italic = { family = "EnvyCodeR Nerd Font", style = "Italic" }
bold_italic = { family = "EnvyCodeR Nerd Font", style = "Bold Italic" }

[selection]
save_to_clipboard = true
